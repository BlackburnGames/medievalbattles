# Local-only development stack for Medieval Battles v6.
#
# SECURITY: this app has unauthenticated SQL injection, local file inclusion,
# and stored XSS (see CLAUDE.md). Both ports are deliberately bound to
# 127.0.0.1 so nothing is reachable from the network. Do not change that.

services:
  db:
    # The host's version (docs/deployment.md), with the host's defaults: a
    # strict sql_mode and utf8mb4_0900_ai_ci. Nothing is set on the command
    # line, because nothing can be on a shared host -- each connection asks
    # for the mode and collation it needs (mb_db_session(), app/include/db.php)
    # and the schema names its own, so this server proves they do.
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mbv6
      MYSQL_USER: mb
      MYSQL_PASSWORD: mb
      MB_ACCOUNTS_DB: mb_accounts
    volumes:
      # db.sql is schema-only; seed.sql adds the rows the app assumes exist.
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # The accounts database, which outlasts a round: docs/rounds.md.
      - ./docker/db/accounts.sh:/docker-entrypoint-initdb.d/03-accounts.sh:ro
      - ./db:/mb-db:ro
      # Not the 5.7 stack's "dbdata": 8.4 cannot open a 5.7 data directory in
      # place, so it starts from its own volume and init scripts. Remove the old
      # one with "docker volume rm" once nothing in it is wanted.
      - dbdata84:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umb", "-pmb"]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build: ./docker/php
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_HOST: db
      MB_DB_NAME: mbv6
      # Who a player is, as against the round MB_DB_NAME names; see
      # app/include/accounts.php.
      MB_ACCOUNTS_DB_NAME: mb_accounts
      MB_DB_USER: mb
      MB_DB_PASS: mb
      # Emulates PHP 4 register_globals. Off: the form handlers read their
      # input through mb_input() now. Set to "1" only to check whether a bug on
      # one of the pages the smoke crawl cannot reach is a porting regression.
      MB_REGISTER_GLOBALS: "0"
      # mysqli reports failing queries as warnings (not exceptions) by default
      # as of Phase 3, so the smoke crawl fails on one instead of swallowing it.
      # Set to "0" to silence them again as a bisection aid.
      # See app/include/connect.php.
      MB_REPORT_QUERIES: "${MB_REPORT_QUERIES:-1}"
    volumes:
      # app/ is the docroot; the repo root is also mounted because update.php
      # includes "app/include/..." and must run with the root as CWD.
      - ./:/repo
      - ./app:/var/www/html
    ports:
      - "127.0.0.1:8080:80"

volumes:
  dbdata84:
