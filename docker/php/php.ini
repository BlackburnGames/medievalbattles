; Medieval Battles v6 -- local development settings.

; ~70 files open with a bare "<?" instead of "<?php".
short_open_tag = On

; Off by default so the browser is usable; prepend.php turns display back on
; for CLI and for requests carrying X-MB-Show-Errors, which is how the smoke
; test still sees diagnostics in the response body. Errors always reach stderr.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; Fixed timezone so date() output is reproducible across golden-master runs.
date.timezone = UTC

; Several logic-only includes emit stray whitespace after their closing tag,
; which breaks any header() call that follows with "headers already sent".
; Buffering absorbs that across the whole app rather than requiring edits to
; ~30 files. Note it also masks the underlying problem, so the offending files
; still need cleaning up during the port.
output_buffering = 4096

; Dev harness hook; it in turn loads compat.php, the legacy compatibility
; layer, which is migration debt that should shrink to nothing during Phase 2.
auto_prepend_file = /opt/mb/prepend.php

session.save_path = /tmp/sessions

; update.php mails a hardcoded gmail address on every tick, and several pages
; mail whatever address a form supplied. Routing mail() to /bin/true makes it
; succeed without delivering, so local runs cannot send to real recipients.
sendmail_path = /bin/true

; The tick script walks every user and is slow by design.
max_execution_time = 300
memory_limit = 256M
